{% extends 'base.html' %}
{% load static %}
{% block title %}Inicio{% endblock %}
{% block content %}
<section class="home-discover section-space">
    <div class="container">
        <div class="section-heading">
            <div>
                <span class="eyebrow">ELIGE TU PLAN</span>
                <h2>¿Qué genero te gusta más?</h2>
            </div>
            <a class="text-link" href="{% url 'home:peliculas' %}">Ver todas las películas <span aria-hidden="true">→</span></a>
        </div>
        <div class="genre-grid">
            <a class="genre-card genre-action" href="{% url 'home:accion' %}">
                <span class="genre-symbol" aria-hidden="true">⚡</span>
                <span class="genre-card-copy"><small>ADRENALINA PURA</small><strong>Acción</strong></span>
                <span class="genre-arrow" aria-hidden="true">↗</span>
            </a>
            <a class="genre-card genre-comedy" href="{% url 'home:comedia' %}">
                <span class="genre-symbol" aria-hidden="true">☀</span>
                <span class="genre-card-copy"><small>BUEN HUMOR</small><strong>Comedia</strong></span>
                <span class="genre-arrow" aria-hidden="true">↗</span>
            </a>
            <a class="genre-card genre-drama" href="{% url 'home:drama' %}">
                <span class="genre-symbol" aria-hidden="true">✦</span>
                <span class="genre-card-copy"><small>HISTORIAS QUE EMOCIONAN</small><strong>Drama</strong></span>
                <span class="genre-arrow" aria-hidden="true">↗</span>
            </a>
        </div>
    </div>
</section>
{% endblock %}
